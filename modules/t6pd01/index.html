<div class="modulex-title">
  <h1>{{name}}</h1>
</div>
<div class="modulex">
  <button type="button" class="modulex-menu-btn" aria-expanded="false" aria-controls="modulex-menu">
    <span class="modulex-menu-btn-label">@menu@</span>
    <span class="material-symbols-outlined modulex-icon" aria-hidden="true">menu</span>
  </button>
  <div class="modulex-menu-overlay" id="modulex-menu-overlay" aria-hidden="true"></div>
  <nav class="modulex-menu" id="modulex-menu" aria-label="@menu@">
    <button class="modulex-menu-close" type="button" aria-label="@menu-close@">
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
    {{pagelist}}
  </nav>
  <div class="modulex-main">
    {{contentRow}}
    <div class="modulex-body">{{text}}</div>
  </div>
</div>
<style>
  /* page-desc — kategori menüsü + görsel solda / açıklama sağda */
  #content {
    justify-content: start;
  }

  .modulex {
    width: 100%;
    max-width: var(--max);
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 20px;
    box-sizing: border-box;
    position: relative;
  }

  .modulex * {
    box-sizing: border-box;
  }

  .modulex-title {
    width: 100%;
    height: --height--px;
    min-height: 120px;
    background-color: --backgroundcolor--;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: --textcolor--;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.35);
  }

  .modulex-title::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: none; /* modulex-title-bg-dyn */
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: --opacity--;
    z-index: 1;
  }

  .modulex-title h1 {
    position: relative;
    z-index: 2;
    font-size: --font-size--px;
    margin: 0;
    padding: 0 16px;
    text-align: center;
    color: --textcolor-- !important;
  }

  .modulex-menu-btn {
    display: none;
    width: 100%;
    background-color: --backgroundcolor--;
    padding: 12px 16px;
    border-radius: --border_radius--;
    border: none;
    cursor: pointer;
    font-weight: bold;
    color: --textcolor--;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .modulex-menu-btn .modulex-icon {
    font-size: 22px;
  }

  .modulex-menu {
    width: 240px;
    flex-shrink: 0;
    background-color: --bgcolor--;
    border-radius: --border_radius--;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: --card_shadow--;
  }

  .modulex-menu-link {
    background-color: #fff;
    padding: 10px 12px;
    border-radius: --border_radius--;
    border: 1px solid rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    text-decoration: none;
    color: --color--;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .modulex-menu-link-text {
    display: block;
    line-height: 1.35;
    font-size: 0.95rem;
  }

  .modulex-menu-link.active,
  .modulex-menu-link:hover {
    background-color: --menu-active--;
    color: --activetext--; /* 31 Eki: sabit beyaz → token */
  }

  .modulex-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Görsel solda, açıklama sağda */
  .modulex-row {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 28px;
    width: 100%;
  }

  .modulex-row-media {
    flex: 0 0 42%;
    max-width: 480px;
    min-width: 0;
  }

  .modulex-img {
    width: 100%;
    border-radius: --border_radius--;
    box-shadow: --card_shadow--;
    background-color: --bgcolor--;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Tam görünüm: kırpma yok, doğal en-boy oranı */
  .modulex-img img {
    width: 100%;
    height: auto;
    max-width: 100%;
    display: block;
    object-fit: contain;
    object-position: center center;
  }

  .modulex-row-desc {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    color: --color--;
  }

  .modulex-lead {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.65;
    color: --color--;
  }

  .modulex-desc-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .modulex-desc-tag {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 12px;
    background-color: --bgcolor--;
    border-radius: --border_radius--;
    border: 1px solid rgba(0, 0, 0, 0.06);
    font-size: 0.85rem;
  }

  .modulex-desc-tag-label {
    font-weight: 600;
    color: --colortitle--;
    text-transform: capitalize;
  }

  .modulex-desc-tag-value {
    color: --color--;
  }

  .modulex-olcu-wrap {
    width: 100%;
    padding: 16px 18px;
    background: rgba(30, 48, 70, 0.06);
    border-radius: --border_radius--;
    border: 1px solid rgba(30, 48, 70, 0.12);
    box-sizing: border-box;
  }

  .modulex-olcu-title {
    margin: 0 0 8px;
    font-size: 1.1rem;
    font-weight: 700;
    color: --colortitle--;
  }

  .modulex-olcu-summary {
    margin: 0 0 12px;
    font-size: 1.05rem;
    color: --coloractive--;
  }

  .modulex-olcu-table {
    width: 100%;
    max-width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }

  .modulex-olcu-table th,
  .modulex-olcu-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(30, 48, 70, 0.1);
    vertical-align: top;
  }

  .modulex-olcu-table th {
    width: 38%;
    font-weight: 600;
    color: --colortitle--;
  }

  .modulex-olcu-table tr:last-child th,
  .modulex-olcu-table tr:last-child td {
    border-bottom: none;
  }

  .modulex-olcu-note {
    margin: 10px 0 0;
    font-size: 0.8rem;
    color: --color--;
    opacity: 0.85;
  }

  .modulex-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
    color: --color--;
    line-height: 1.6;
  }

  .modulex-body p {
    margin: 0 0 0.75em;
  }

  /* Kurumsal içerik — mobilya ve benzeri projeler */
  .mob-kurum-wrap {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }

  .mob-kurum-lead {
    margin: 0 0 28px;
    padding: 0 0 0 18px;
    border-left: 4px solid --coloractive--;
    font-size: 1.12rem;
    line-height: 1.75;
    color: --color--;
  }

  .mob-kurum-text {
    margin: 0 0 18px;
    font-size: 1rem;
    line-height: 1.7;
    color: --color--;
  }

  .mob-kurum-text a {
    color: --coloractive--;
    text-decoration: none;
    font-weight: 600;
  }

  .mob-kurum-text a:hover {
    text-decoration: underline;
    cursor: pointer;
  }

  .mob-kurum-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin: 0 0 28px;
  }

  .mob-kurum-card {
    padding: 20px 18px;
    background-color: --bgcolor--;
    border-radius: --border_radius--;
    border: 1px solid rgba(30, 48, 70, 0.1);
    box-shadow: --card_shadow--;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .mob-kurum-card:hover {
    transform: translateY(-2px);
    cursor: default;
  }

  .mob-kurum-card strong {
    display: block;
    font-size: 1.35rem;
    font-weight: 800;
    color: --coloractive--;
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .mob-kurum-card span {
    display: block;
    font-size: 0.92rem;
    line-height: 1.55;
    color: --color--;
    opacity: 0.92;
  }

  .mob-kurum-highlight {
    margin: 8px 0 0;
    padding: 18px 20px;
    background: rgba(30, 48, 70, 0.06);
    border-radius: --border_radius--;
    border: 1px solid rgba(30, 48, 70, 0.08);
    font-size: 0.98rem;
    line-height: 1.65;
    color: --color--;
  }

  .mob-kurum-highlight-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: --colortitle--;
    margin-bottom: 6px;
  }

  .mob-kurum-section {
    margin: 0 0 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(30, 48, 70, 0.08);
  }

  .mob-kurum-section:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .mob-kurum-section h3 {
    margin: 0 0 10px;
    font-size: 1.05rem;
    font-weight: 700;
    color: --colortitle--;
  }

  .mob-kurum-list {
    margin: 0 0 20px;
    padding-left: 1.35rem;
    line-height: 1.75;
    color: --color--;
  }

  .mob-kurum-list li {
    margin-bottom: 8px;
  }

  .mob-kurum-legal .mob-kurum-lead {
    font-size: 1.05rem;
  }

  .mob-kurum-hero {
    margin: 0 0 24px;
    padding: 22px 24px;
    border-radius: --border_radius--;
    background: linear-gradient(135deg, rgba(30, 48, 70, 0.94) 0%, rgba(42, 69, 96, 0.88) 100%);
    box-shadow: --card_shadow--;
  }

  .mob-kurum-hero-legal {
    background: linear-gradient(135deg, rgba(30, 48, 70, 0.08) 0%, rgba(222, 109, 38, 0.12) 100%);
    border: 1px solid rgba(30, 48, 70, 0.1);
  }

  .mob-kurum-hero-label {
    display: inline-block;
    margin: 0 0 8px;
    padding: 4px 12px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #fff;
    background: rgba(222, 109, 38, 0.9);
    border-radius: 999px;
  }

  .mob-kurum-hero-legal .mob-kurum-hero-label {
    color: --colortitle--;
    background: rgba(30, 48, 70, 0.1);
  }

  .mob-kurum-hero-title {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.35;
    color: #fff;
  }

  .mob-kurum-hero-legal .mob-kurum-hero-title {
    color: --colortitle--;
  }

  .mob-kurum-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 26px;
  }

  .mob-kurum-pill {
    display: inline-block;
    padding: 8px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    color: --colortitle--;
    background: rgba(30, 48, 70, 0.06);
    border: 1px solid rgba(30, 48, 70, 0.12);
    border-radius: 999px;
  }

  .mob-kurum-section-title {
    margin: 0 0 12px;
    font-size: 1.15rem;
    font-weight: 700;
    color: --colortitle--;
  }

  .mob-kurum-split {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin: 0 0 26px;
  }

  .mob-kurum-split-side .mob-kurum-highlight {
    margin-bottom: 14px;
  }

  .mob-kurum-split-side .mob-kurum-highlight:last-child {
    margin-bottom: 0;
  }

  .mob-kurum-list-check {
    list-style: none;
    padding-left: 0;
  }

  .mob-kurum-list-check li {
    position: relative;
    padding-left: 1.65rem;
    margin-bottom: 12px;
  }

  .mob-kurum-list-check li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.45em;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: --coloractive--;
  }

  .mob-kurum-cta {
    margin-top: 28px;
    padding: 22px 24px;
    text-align: center;
    background: linear-gradient(135deg, rgba(222, 109, 38, 0.12) 0%, rgba(30, 48, 70, 0.06) 100%);
    border-radius: --border_radius--;
    border: 1px solid rgba(222, 109, 38, 0.25);
  }

  .mob-kurum-cta-text {
    margin: 0 0 14px;
    font-size: 1rem;
    line-height: 1.6;
    color: --color--;
  }

  .mob-kurum-cta-link {
    display: inline-block;
    padding: 12px 28px;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    background: --coloractive--;
    border-radius: --border_radius--;
    text-decoration: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    cursor: pointer;
  }

  .mob-kurum-cta-link:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }

  .mob-kurum-stat-band {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin: 0 0 28px;
  }

  .mob-kurum-stat-item {
    text-align: center;
    padding: 18px 14px;
    background: linear-gradient(180deg, rgba(30, 48, 70, 0.05) 0%, rgba(222, 109, 38, 0.08) 100%);
    border-radius: --border_radius--;
    border: 1px solid rgba(30, 48, 70, 0.1);
  }

  .mob-kurum-stat-item strong {
    display: block;
    font-size: 1.5rem;
    font-weight: 800;
    color: --coloractive--;
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .mob-kurum-stat-item span {
    display: block;
    font-size: 0.78rem;
    line-height: 1.4;
    color: --color--;
    opacity: 0.9;
  }

  .mob-kurum-steps {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 0 0 28px;
  }

  .mob-kurum-step {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 16px 18px;
    background-color: --bgcolor--;
    border-radius: --border_radius--;
    border: 1px solid rgba(30, 48, 70, 0.08);
  }

  .mob-kurum-step-num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: --coloractive--;
    color: #fff;
    font-weight: 800;
    font-size: 0.88rem;
    line-height: 34px;
    text-align: center;
  }

  .mob-kurum-step-body strong {
    display: block;
    font-size: 0.98rem;
    color: --colortitle--;
    margin-bottom: 4px;
  }

  .mob-kurum-step-body span {
    display: block;
    font-size: 0.9rem;
    line-height: 1.55;
    color: --color--;
  }

  .mob-kurum-quote {
    margin: 0 0 26px;
    padding: 20px 22px 20px 20px;
    border-left: 4px solid --coloractive--;
    background: rgba(222, 109, 38, 0.08);
    border-radius: 0 --border_radius-- --border_radius-- 0;
    font-size: 1.02rem;
    line-height: 1.65;
    color: --colortitle--;
    font-style: italic;
  }

  a.mob-kurum-card-link {
    display: block;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  a.mob-kurum-card-link:hover {
    transform: translateY(-4px);
    border-color: rgba(222, 109, 38, 0.45);
    box-shadow: 0 12px 28px rgba(30, 48, 70, 0.14);
  }

  a.mob-kurum-card-link strong {
    color: --colortitle--;
  }

  .mob-kurum-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin: 28px 0 0;
    padding-top: 22px;
    border-top: 1px solid rgba(30, 48, 70, 0.1);
  }

  .mob-kurum-nav-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: --colortitle--;
    margin-right: 4px;
  }

  .mob-kurum-nav a {
    display: inline-block;
    padding: 8px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    color: --colortitle--;
    background: rgba(30, 48, 70, 0.06);
    border: 1px solid rgba(30, 48, 70, 0.12);
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .mob-kurum-nav a:hover {
    background: rgba(222, 109, 38, 0.14);
    border-color: rgba(222, 109, 38, 0.35);
  }

  .mob-kurum-meta {
    margin: 0 0 20px;
    font-size: 0.82rem;
    color: --color--;
    opacity: 0.75;
  }

  @media screen and (min-width: 768px) {
    .mob-kurum-split {
      grid-template-columns: 1.4fr 1fr;
      gap: 28px;
      align-items: start;
    }

    .mob-kurum-hero-title {
      font-size: 1.5rem;
    }

    .mob-kurum-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media screen and (min-width: 1024px) {
    .mob-kurum-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media screen and (min-width: 1025px) {
    .modulex-menu-overlay {
      display: none !important;
    }

    .modulex-menu-close {
      display: none !important;
    }

    .modulex-menu {
      position: static !important;
      left: auto !important;
      width: 240px !important;
      max-width: none !important;
      height: auto !important;
      visibility: visible !important;
      box-shadow: --card_shadow-- !important;
    }
  }

  @media screen and (max-width: 1024px) {
    .modulex-menu-btn {
      display: flex;
      order: 1;
      width: 100%;
    }

    .modulex-menu-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .modulex-menu-overlay.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    .modulex {
      flex-direction: column;
      padding: 0 10px;
      gap: 12px;
    }

    .modulex-menu {
      position: fixed;
      top: 0;
      left: 0;
      transform: translateX(-100%);
      width: 82%;
      max-width: 320px;
      height: 100%;
      z-index: 9999;
      transition: transform 0.3s ease;
      overflow-y: auto;
      visibility: hidden;
      border-radius: 0;
    }

    .modulex-menu.active {
      transform: translateX(0);
      visibility: visible;
    }

    .modulex-menu-close {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      width: 100%;
      color: inherit;
    }

    .modulex-menu > .modulex-menu-link {
      margin: 0 10px 6px;
    }

    .modulex-main {
      order: 2;
      width: 100%;
    }
  }

  @media screen and (max-width: 768px) {
    .modulex-row {
      flex-direction: column;
      gap: 16px;
    }

    .modulex-row-media {
      flex: none;
      max-width: 100%;
      width: 100%;
    }

    .modulex-title h1 {
      font-size: calc(--font-size--px * 0.75);
    }
  }

  @media screen and (max-width: 600px) {
    .modulex {
      margin-top: 12px;
    }

    .modulex-lead {
      font-size: 1rem;
    }
  }

  /* W2: erisilebilirlik — animasyon kapatma */
  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
<script>
  setTimeout(function() {
    var menuToggleBtn = document.querySelector(".modulex-menu-btn");
    var menu = document.querySelector(".modulex-menu");
    var overlay = document.querySelector(".modulex-menu-overlay");
    var closeButton = document.querySelector(".modulex-menu-close");

    if (!menuToggleBtn || !menu) {
      return;
    }

    var mql = window.matchMedia("(max-width: 1024px)");

    function openMenu() {
      menu.classList.add("active");
      if (overlay) {
        overlay.classList.add("active");
        overlay.setAttribute("aria-hidden", "false");
      }
      menuToggleBtn.setAttribute("aria-expanded", "true");
      document.body.style.overflow = "hidden";
    }

    function closeMenu() {
      menu.classList.remove("active");
      if (overlay) {
        overlay.classList.remove("active");
        overlay.setAttribute("aria-hidden", "true");
      }
      menuToggleBtn.setAttribute("aria-expanded", "false");
      document.body.style.overflow = "";
      menuToggleBtn.focus();
    }

    menuToggleBtn.addEventListener("click", function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (menu.classList.contains("active")) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    if (closeButton) {
      closeButton.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        closeMenu();
      });
    }

    if (overlay) {
      overlay.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        closeMenu();
      });
    }

    menu.addEventListener("click", function(event) {
      var link = event.target.closest("a");
      if (link && !event.target.closest(".modulex-menu-close")) {
        closeMenu();
      }
    });

    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape" && menu.classList.contains("active")) {
        closeMenu();
      }
    });

    menuToggleBtn.addEventListener("keydown", function(e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (menu.classList.contains("active")) {
          closeMenu();
        } else {
          openMenu();
        }
      }
    });

    function handleBreakpoint() {
      if (!mql.matches) {
        closeMenu();
      }
    }

    if (typeof mql.addEventListener === "function") {
      mql.addEventListener("change", handleBreakpoint);
    } else if (typeof mql.addListener === "function") {
      mql.addListener(handleBreakpoint);
    }
    handleBreakpoint();
  }, 100);
</script>
