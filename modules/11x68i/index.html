<style>
  /* tanitim-mozaik — Tanıtımın tüm parçaları tek bir karo ızgarasında eşit muamele görür (bento); bölünmüş metin-görsel değil. */
  .modulex-tanitim-mozaik { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-tanitim-mozaik *, .modulex-tanitim-mozaik *::before, .modulex-tanitim-mozaik *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-tanitim-mozaik :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-tanitim-mozaik :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-tanitim-mozaik :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-tanitim-mozaik :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-tanitim-mozaik img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-tanitim-mozaik) img { height: auto; }
  .modulex-tanitim-mozaik [hidden] { display: none !important; }
  .modulex-tanitim-mozaik :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-tanitim-mozaik :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-tanitim-mozaik-ic { max-width: --max--; margin-inline: auto; }
  .modulex-tanitim-mozaik-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }

  .modulex-tanitim-mozaik-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-tanitim-mozaik-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-tanitim-mozaik-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-tanitim-mozaik-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-tanitim-mozaik-dugme:hover { transform: translateY(-2px); }
  .modulex-tanitim-mozaik-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-tanitim-mozaik-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-tanitim-mozaik-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-tanitim-mozaik-bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: dense; gap: 14px; }
  .modulex-tanitim-mozaik-karo { display: grid; align-content: start; gap: 10px; padding: 26px; border-radius: --yuvarlak--; background: --kartBg--; transition: transform 0.3s ease; }
  .modulex-tanitim-mozaik-karo:hover { transform: scale(0.985); }
  .modulex-tanitim-mozaik-karo--giris { grid-column: span 2; grid-row: span 2; align-content: end; gap: 16px; background: --vurguBg--; color: --vurguText--; }
  .modulex-tanitim-mozaik-karo--giris .modulex-tanitim-mozaik-ust, .modulex-tanitim-mozaik-karo--giris .modulex-tanitim-mozaik-metin { color: inherit; }
  .modulex-tanitim-mozaik-karo--giris .modulex-tanitim-mozaik-dugme { background: --vurguText--; color: --vurguBg--; border-color: --vurguText--; }
  .modulex-tanitim-mozaik-karo--giris .modulex-tanitim-mozaik-dugme--ikincil { background: transparent; color: inherit; border-color: color-mix(in srgb, --vurguText-- 40%, transparent); }
  .modulex-tanitim-mozaik-karo--gorsel { grid-column: span 2; padding: 0; overflow: hidden; min-height: 240px; }
  .modulex-tanitim-mozaik-gorsel { width: 100%; height: 100%; object-fit: cover; }
  .modulex-tanitim-mozaik-mikon { color: --accentInk--; font-size: 30px; }
  /* giriş 2×2 + görsel 2×1 → maddeler ikişer; tek kalan son madde satırı doldurur (boş hücre yok) */
  .modulex-tanitim-mozaik-karo--gorsel ~ .modulex-tanitim-mozaik-karo--madde:last-child:nth-child(odd) { grid-column: 1 / -1; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-tanitim-mozaik :is(.modulex-tanitim-mozaik-baslik, .modulex-tanitim-mozaik-ust, h3, h4, strong) { letter-spacing: 0; }

  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-tanitim-mozaik *, .modulex-tanitim-mozaik *::before, .modulex-tanitim-mozaik *::after { animation: none !important; transition: none !important; }
  }
</style>
